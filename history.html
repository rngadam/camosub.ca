<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre histoire | Our History - Club CAMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/history.css">
    <link rel="preload" as="image" href="images/camo-subaquatique.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9V8Q4XJXLD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9V8Q4XJXLD');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta name="description" content="L'histoire du Club CAMO Subaquatique, de ses débuts à aujourd'hui. Découvrez l'évolution du hockey et du rugby subaquatique à Montréal.">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    {% include navbar.html %}

    <!-- Header Banner -->
    <header class="bg-[#386DC0] text-white py-10 text-center shadow-lg">
        <a href="index.html" class="inline-block group">
            <img src="images/camo-subaquatique.png" alt="Logo Club CAMO Subaquatique" class="mx-auto h-24 md:h-32 transition-transform group-hover:scale-105">
        </a>
        <h1 id="history-page-title" class="text-3xl md:text-4xl font-extrabold mt-3">Notre histoire</h1>
        <p class="mt-1 text-md md:text-lg italic text-blue-100">Club CAMO Subaquatique de Montréal</p>
    </header>

    <div class="container mx-auto px-4 py-8 flex flex-col md:flex-row flex-1">
        <!-- Table of Contents (Left Column) -->
        <aside id="toc-container" class="w-full md:w-1/4 p-4 sticky-top-offset">
            <h2 id="toc-title" class="text-xl font-semibold mb-3 text-gray-700">Table des matières</h2>
            <nav id="toc" class="text-gray-600"></nav>
        </aside>

        <!-- Content (Right Column) -->
        <main id="content-container" class="w-full md:w-3/4 p-4 prose max-w-none">
            <div class="text-center py-12"><i class="fa fa-spinner fa-spin text-3xl text-blue-600"></i></div>
        </main>
    </div>

    {% include footer.html %}

    <script src="assets/js/main.js"></script>
    <script>
        const contentContainer = document.getElementById('content-container');
        const tocContainer = document.getElementById('toc');
        const tocTitle = document.getElementById('toc-title');
        const historyTitle = document.getElementById('history-page-title');

        function slugify(text) {
            return text.toString().toLowerCase()
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .replace(/\s+/g, '-')
                .replace(/[^\w-]+/g, '')
                .replace(/--+/g, '-');
        }

        async function loadContent(lang) {
            const isFr = lang === 'fr';
            document.documentElement.lang = lang;
            const markdownPath = isFr ? 'docs/histoire_camo_hockey_subaquatique.fr.md' : 'docs/histoire_camo_hockey_subaquatique.en.md';

            if (historyTitle) {
                historyTitle.textContent = isFr ? "Notre histoire" : "Our History";
            }
            if (tocTitle) {
                tocTitle.textContent = isFr ? "Table des matières" : "Table of Contents";
            }
            document.title = (isFr ? "Notre histoire" : "Our History") + " - Club CAMO";

            try {
                const response = await fetch(markdownPath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();

                // Render markdown content
                contentContainer.innerHTML = marked.parse(markdown);

                // Generate TOC
                tocContainer.innerHTML = '';
                const headings = contentContainer.querySelectorAll('h1, h2, h3, h4, h5, h6');
                const tocList = document.createElement('ul');
                tocList.className = 'space-y-2';

                headings.forEach(heading => {
                    if (heading.tagName === 'H1' && heading === contentContainer.querySelector('h1')) {
                        // Skip main H1 inside doc as it duplicates the header
                    } else {
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        const id = slugify(heading.textContent);
                        heading.id = id;
                        link.href = `#${id}`;
                        link.textContent = heading.textContent;
                        link.className = 'hover:underline block py-0.5 text-sm ' + (heading.tagName === 'H3' ? 'pl-4 text-gray-500' : 'font-medium text-gray-700');
                        listItem.appendChild(link);
                        tocList.appendChild(listItem);
                    }
                });

                tocContainer.appendChild(tocList);
            } catch (error) {
                console.error("Error loading history:", error);
                contentContainer.innerHTML = `<p class="text-red-500">Erreur lors du chargement : ${error.message}</p>`;
            }
        }

        // Listen for language switch from main.js
        window.addEventListener('languageChanged', (e) => {
            if (e.detail && e.detail.lang) {
                loadContent(e.detail.lang);
            }
        });

        // Initial language
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const currentLang = urlParams.get('lang') || localStorage.getItem('preferredLang') || 'fr';
            loadContent(currentLang);
        });

        // Smooth scroll for TOC links
        document.addEventListener('click', function (event) {
            if (event.target.matches('#toc a[href^="#"]')) {
                event.preventDefault();
                const targetId = event.target.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });
    </script>
</body>
</html>
