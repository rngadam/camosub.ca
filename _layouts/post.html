---
layout: default
---
{% include lang_switch.html %}
{% include header.html %}

<article class="container mx-auto px-4 py-12 max-w-4xl">
    <div class="bg-white text-gray-800 rounded-xl shadow-xl p-8 md:p-12">
        <header class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-2 text-blue-900">{{ page.title }}</h1>
            <p class="text-gray-500 text-sm"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
            {% if page.image %}
            <img src="{{ page.image }}" alt="{{ page.title }}" class="mt-4 rounded-lg shadow w-full max-h-96 object-cover">
            {% endif %}
        </header>
        <div class="prose max-w-none text-lg leading-relaxed">
            {{ content }}
        </div>
        <footer class="mt-8 pt-4 border-t border-gray-200">
            <a href="{{ '/blog.html' | relative_url }}" class="text-blue-600 hover:underline font-semibold">&larr; Retour au blog / Back to blog</a>
        </footer>
    </div>
</article>

{% include footer.html %}
